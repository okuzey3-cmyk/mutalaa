<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mütalaa</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #14120f;
    color: #f5efe4;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: block; }
  #reader.active { display: flex; }

  /* ---- ANA SAYFA ---- */
  #home { padding: 1.25rem 1rem 5rem; max-width: 480px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .logo-circle {
    width: 34px; height: 34px; border-radius: 50%;
    background: #1e4d3e; display: flex; align-items: center; justify-content: center;
  }
  .logo-circle svg { width: 18px; height: 18px; }
  .brand-name { font-family: Georgia, serif; font-size: 19px; }
  .icon-btn { width: 20px; height: 20px; opacity: 0.7; }

  .featured {
    background: linear-gradient(135deg, #1d9e75, #178a56);
    border-radius: 14px; padding: 1.25rem; margin-bottom: 1.25rem;
    cursor: pointer;
  }
  .featured p.label { font-size: 12px; color: #dff5e8; margin-bottom: 4px; }
  .featured p.title { font-family: Georgia, serif; font-size: 18px; color: #fff; line-height: 1.5; margin-bottom: 8px; }
  .featured p.meta { font-size: 12px; color: #dff5e8; }

  .chips { display: flex; gap: 8px; margin-bottom: 1.25rem; overflow-x: auto; padding-bottom: 4px; }
  .chip {
    font-size: 12px; padding: 7px 14px; border-radius: 8px; white-space: nowrap;
    background: #24211b; color: #cfc6b4; flex-shrink: 0; cursor: pointer;
  }
  .chip.active { background: #d4a339; color: #412402; }

  .story-list { display: flex; flex-direction: column; gap: 12px; }
  .story-card {
    border-radius: 12px; padding: 1rem; display: flex; gap: 12px; align-items: center;
    cursor: pointer;
  }
  .story-icon {
    width: 48px; height: 48px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .story-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .story-meta { font-size: 12px; }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #1a1712; border-top: 0.5px solid #2a261e;
    display: flex; justify-content: space-around; padding: 12px 0 max(12px, env(safe-area-inset-bottom));
    max-width: 480px; margin: 0 auto;
  }
  .tab { font-size: 20px; opacity: 0.5; }
  .tab.active { opacity: 1; color: #d4a339; }

  /* ---- OKUMA / TAM EKRAN KİTAP ---- */
  #reader {
    position: fixed; inset: 0; z-index: 20;
    background: #dcd3bd;
    display: none;
    flex-direction: column;
  }
  #reader.active { display: flex; }
  .reader-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; flex-shrink: 0;
  }
  .back-btn { font-size: 13px; color: #6b5a3e; cursor: pointer; }
  .page-indicator { font-size: 12px; color: #8a7a5c; font-family: Georgia, serif; }

  .book-wrap {
    flex: 1; min-height: 0; position: relative; perspective: 2200px;
    padding: 0 4px 4px; overflow: hidden;
  }
  .book { position: absolute; inset: 0 4px 4px; transform-style: preserve-3d; }

  .page {
    position: absolute; inset: 0;
    background: #f7f1e3;
    background-image: radial-gradient(ellipse at top left, rgba(255,255,255,0.5), transparent 60%);
    color: #2b2420;
    box-shadow: -2px 0 10px rgba(0,0,0,0.15), 0 2px 14px rgba(0,0,0,0.2);
    padding: 40px 26px 56px;
    overflow-y: auto;
    transform-origin: left center;
    transform: rotateY(0deg);
    backface-visibility: hidden;
  }
  .page.turning-fwd { animation: curlFwd 0.7s cubic-bezier(0.45,0.05,0.55,0.95) forwards; }
  .page.turning-back { animation: curlBack 0.7s cubic-bezier(0.45,0.05,0.55,0.95) forwards; }
  .page.flipped { transform: rotateY(-180deg); }

  @keyframes curlFwd {
    0%   { transform: rotateY(0deg) translateZ(0); box-shadow: -2px 0 10px rgba(0,0,0,0.15); }
    45%  { transform: rotateY(-95deg) translateZ(30px) scaleY(0.985); box-shadow: -40px 10px 60px rgba(0,0,0,0.45); }
    100% { transform: rotateY(-180deg) translateZ(0); box-shadow: -2px 0 10px rgba(0,0,0,0.15); }
  }
  @keyframes curlBack {
    0%   { transform: rotateY(-180deg) translateZ(0); box-shadow: -2px 0 10px rgba(0,0,0,0.15); }
    45%  { transform: rotateY(-85deg) translateZ(30px) scaleY(0.985); box-shadow: -40px 10px 60px rgba(0,0,0,0.45); }
    100% { transform: rotateY(0deg) translateZ(0); box-shadow: -2px 0 10px rgba(0,0,0,0.15); }
  }

  .page-num { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font-size: 11px; color: #a8977a; font-family: Georgia, serif; }
  .page .eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #a6772c; margin-bottom: 10px; }
  .page h3 { font-family: Georgia, serif; font-size: 22px; line-height: 1.35; margin-bottom: 18px; color: #221c15; }
  .page p { font-family: Georgia, serif; font-size: 16px; line-height: 1.85; color: #3d342a; text-align: justify; }
  .page ul { font-family: Georgia, serif; font-size: 14px; line-height: 1.7; color: #3d342a; padding-left: 20px; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 22px; flex-shrink: 0; }
  .nav-btn {
    background: transparent; color: #4a3f2e; border: none;
    font-size: 14px; font-family: Georgia, serif; padding: 8px 4px;
  }
  .nav-btn:disabled { opacity: 0.25; }
</style>
</head>
<body>

<div id="home" class="screen active">
  <div class="header">
    <div class="brand">
      <div class="logo-circle">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 6 L12 18 Q9 16.5 6 17 L6 7.5 Q9 6.2 12 6 Z" fill="#faf5e8"/><path d="M12 6 L12 18 Q15 16.5 18 17 L18 7.5 Q15 6.2 12 6 Z" fill="#faf5e8" opacity="0.85"/></svg>
      </div>
      <span class="brand-name">Mütalaa</span>
    </div>
    <svg class="icon-btn" viewBox="0 0 24 24" fill="none" stroke="#a89f8f" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
  </div>

  <div class="featured" onclick="openReader('eyyub')">
    <p class="label">bugünün hikayesi</p>
    <p class="title">Bir yolculuğun sabrı: Hz. Eyyub'un hikayesi</p>
    <p class="meta">9 dakikalık okuma</p>
  </div>

  <div class="chips">
    <span class="chip active">tümü</span>
    <span class="chip">peygamberler</span>
    <span class="chip">sahabe</span>
    <span class="chip">evliyalar</span>
  </div>

  <div class="story-list">
    <div class="story-card" style="background:#241a10" onclick="openReader('selman')">
      <div class="story-icon" style="background:#d4832a">🌙</div>
      <div>
        <div class="story-title">Selman-ı Farisi: Hakikat Peşinde Bir Ömür</div>
        <div class="story-meta" style="color:#b8ab90">sahabe · 6 dk</div>
      </div>
    </div>
    <div class="story-card" style="background:#26151f" onclick="openReader('uveys')">
      <div class="story-icon" style="background:#e0578a">🤲</div>

        <div class="story-title">Üveys el-Karani: Görmeden Sevmek</div>

  </div>

  <div class="tabbar">
    <span class="tab active">⌂</span>
    <span class="tab">🔖</span>
    <span class="tab">▤</span>
    <span class="tab">☺</span>
  </div>
</div>

<div id="reader" class="screen">
  <div class="reader-top">
    <span class="back-btn" onclick="goHome()">← ana sayfa</span>
    <span class="page-indicator" id="pageIndicator">1 / 3</span>
  </div>

  <div class="book-wrap">
    <div class="book" id="book"></div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn" onclick="prevPage()">‹ önceki sayfa</button>
    <button class="nav-btn" id="nextBtn" onclick="nextPage()">sonraki sayfa ›</button>
  </div>
</div>

<script>
const stories = {
  eyyub: {
    title: "Bir yolculuğun sabrı: Hz. Eyyub'un hikayesi",
    pages: [
      "Bir insan düşünün: malı mülkü yerinde, çocukları sağlıklı, sağlığı yerinde. Sonra bir gün bunların hepsi elinden alınıyor — tek tek değil, art arda. İşte Hz. Eyyub'un hikayesi böyle başlar. Kur'an'da dört surede, sekiz ayette adı geçen bu peygamber, 'sabır' dendiğinde akla ilk gelen isimdir. Ama onun sabrı, sadece 'sessiz kalmak' değildi. Zor günlerinde bile Allah'a yönelmeyi hiç bırakmamasıydı.<br><br>Eyyub'un hikayesi, aslında hepimizin bir gün karşılaşabileceği bir soruyu ortaya koyar: elimizdeki her şey birden yok olsa, hâlâ aynı insan kalabilir miyiz?",
      "Eyyub, önce servetini kaybetti. Sonra çocuklarını. En sonunda da bedenine ağır bir hastalık geldi. Kur'an, bu hastalığın ne olduğunu detaylandırmaz — sadece 'sıkıntı ve acı' olarak bahseder. Yıllar içinde anlatılagelen 'vücudunu kurtların sarması' gibi detaylar, aslında güvenilir kaynaklara dayanmıyor; bunlar sonradan eklenmiş rivayetler.<br><br>Kur'an'ın verdiği bilgiyle yetinmek, kıssayı en doğru haliyle anlamanın yoludur. Çünkü asıl mesaj, hastalığın türünde değil, insanın ona verdiği tepkide saklı.",
      "Bu kadar ağır bir imtihanda bir insan ne yapar? Çoğu zaman öfkelenir, sorar: 'Neden ben?' Etrafındaki insanlara sitem eder, hatta bazen inancından şüphe etmeye başlar. Eyyub farklıydı. Kur'an'da onun duası şöyle aktarılır: 'Rabbim, başıma bela geldi, sen merhametlilerin en merhametlisisin.'<br><br>Dikkat edin — bu bir şikayet değil, bir sığınma. Eyyub, acısını inkar etmiyor; hissettiği gerçek acıyı gizlemiyor. Ama onu Allah'tan başka kimseye şikayet etmiyor. Bu ayrım, sabrın ne olduğunu anlamak için çok önemli.",
      "Bir hadiste Hz. Eyyub şöyle tarif edilir: 'insanların en halimi, en sabırlısı ve öfkesini en çok yeneni.' Bu tanım bize önemli bir şey söylüyor: sabır, pasif bir teslimiyet değil. Aksine, öfkeyi hissedip onu kontrol edebilmek, çok daha zor ve aktif bir iç mücadeledir.<br><br>Yıllar süren bu zorlu dönemde, çevresindeki insanların çoğu ondan uzaklaştı. Ama Eyyub'un duruşu değişmedi. Acı çekerken bile nazik, sabırlı ve Allah'a bağlı kalabileceğini gösterdi — bu, günümüzde bile herkesin başarabileceği bir şey değil.",
      "Sonunda Eyyub'un duası kabul oldu. Kur'an, ona şifa verildiğini ve kaybettiklerinin yerine yenilerinin, hatta daha fazlasının verildiğini anlatır. Bu detay önemli: Allah, sabrın karşılığını sadece 'eski haline döndürmek' ile değil, fazlasıyla ödüllendirerek verdi.<br><br>Ama hikayenin asıl mesajı burada bitmiyor. Çünkü sabrın karşılığı her zaman bu dünyada, bu kadar net görülmeyebilir. Eyyub'un hikayesi bir istisna değil, bir örnektir — sabrın anlamının sonuçta değil, duruşta olduğunu hatırlatan bir örnek.",
      "Bugün 'Eyyub sabrı' dediğimizde, aslında bu duruşa işaret ediyoruz: acıyı inkar etmeden, ama ondan yıkılmadan yaşamaya devam edebilme gücü. Bu, hastalıkla, kayıpla, beklenmedik bir yıkımla karşılaşan her insanın kendinde arayabileceği bir şey.<br><br>Eyyub'un hikayesi bize şunu hatırlatıyor: sabır, acının olmadığını iddia etmek değildir. Acıyı yaşarken bile, doğru yerde durmayı seçmektir. Bazen en büyük imtihanlar, en büyük dersleri de beraberinde getirir."
    ],
    sources: [
      "Kur'an-ı Kerim, Sâd Suresi, 41-44. ayetler",
      "Kur'an-ı Kerim, Enbiya Suresi, 83-84. ayetler",

      "Diyanet İşleri Başkanlığı, Kur'an-ı Kerim Meali ve Tefsiri"
    ]
  },
  selman: {
    title: "Selman-ı Farisi: Hakikat Peşinde Bir Ömür",
    pages: [
      "Selman, İran'da Mecusi bir ailede doğdu. Zengin bir aileydi, babası bölgenin ileri gelenlerindendi. Ama Selman'ın içinde hep bir soru vardı: 'Gerçek din hangisi?' Bu soru, genç yaşta onu rahatsız etmeye başladı — çevresindeki hiçbir cevap onu tatmin etmiyordu.<br><br>Bu soru, sonunda onu ailesinin dininden koparıp, hayatının geri kalanını şekillendirecek uzun bir yolculuğa çıkardı. Kimse ona bu yolun nereye varacağını söylememişti; o sadece aramaya devam etti.",
      "Önce Hristiyanlığa yöneldi. Bir kilisede rahiplerin yanında yıllarca hizmet etti, onlardan öğrendi, onlarla yaşadı. Her rahip ölürken ona bir sonraki öğretmeni işaret etti — Selman da o öğretmenin peşinden gitti, şehirden şehre.<br><br>Bu, kolay bir yolculuk değildi. Ailesinden, evinden, tanıdığı her şeyden uzaklaşmıştı. Ama içindeki soru onu durdurmadı. Sonunda son rahip ona şunu söyledi: 'Artık senin yolunda olan kimseyi tanımıyorum. Ama Arap topraklarından bir peygamber çıkacak, iki taşlık arasına hicret edecek.'",
      "Bu sözler Selman'ı Arabistan'a götürdü. Ancak yolculukta beklenmedik bir şey oldu: bir kabile tarafından köle olarak satıldı. Yıllarca özgürlüğünü kaybetmiş halde yaşadı. Bir insanın hakikat arayışı, en beklenmedik anda en büyük bedeli isteyebilir.<br><br>Medine'ye köle olarak geldiğinde bile, aradığı işaretleri kontrol etmeyi bırakmadı. Ona anlatılan alametleri hafızasında taşıyordu — bir gün bulacağına inanıyordu.",
      "Hz. Peygamber'i gördüğünde, ona anlatılan tüm işaretleri onda buldu ve hemen Müslüman oldu. Ama özgürlüğü hâlâ yoktu. Peygamber'in tavsiyesiyle, sahabenin de katkısıyla — 300 hurma fidanı dikme ve belli bir bedel ödeme karşılığında — özgürlüğüne kavuştu.<br><br>Bu, İslam tarihinde ilk yazılı özgürlük anlaşmalarından biri olarak kabul edilir. Selman artık hem inancına hem de bedenine kavuşmuştu.",
      "Selman'ın katkıları burada bitmedi. Hendek Savaşı öncesi, Medine'yi çevreleyen bir hendek kazma fikrini getiren oydu — bu, Arap savaş geleneğinde görülmemiş bir taktikti ve savaşın seyrini değiştirdi. Onun bilgisi ve tecrübesi, sahabe arasında ona özel bir saygı kazandırdı.<br><br>Zekası, ilmi ve ahlakıyla Hz. Peygamber'in övgüsüne mazhar oldu; artık sadece bir arayışçı değil, İslam toplumunun saygın bir üyesiydi.",
      "Hz. Peygamber onun için 'Selman bizden, Ehl-i Beyt'tendir' buyurdu. Bir hadiste de 'hakikat Süreyya yıldızında olsa bile Selman onu bulur' denildi — bu, onun arayışındaki azmi anlatan en güçlü ifadelerden biri.<br><br>Onun hikayesi, gerçek bir arayışın hiçbir bedeli çok görmediğini gösterir. Ailesinden, özgürlüğünden, yıllarından vazgeçti — ama aradığını bulduğunda, hepsinin değdiğini gördü. Bugün hâlâ 'hakikati arayan bir insan ne kadar ileri gidebilir?' sorusuna en güzel cevaplardan biri olarak anılıyor."
    ],
    sources: [
      "TDV İslam Ansiklopedisi, \"Selmân-ı Fârisî\" maddesi",
      "Ahmed b. Hanbel, el-Müsned"
    ]
  },
  uveys: {
    title: "Üveys el-Karani: Görmeden Sevmek",
    pages: [
      "Üveys, Yemen'de, Murad kabilesinin Karan koluna mensup sade bir gençti. Hz. Peygamber'in yaşadığı dönemde Müslüman oldu — ama İslam tarihinin en tanıdık isimlerinden biri olmasına rağmen, onu hiç göremedi.<br><br>Bu, kendi tercihi değildi. Hayatı, onu farklı bir sadakate yönlendirmişti: annesine olan bağlılığına.",
      "Sebebi basitti ama derindi: annesi vardı ve gözleri görmüyordu. Üveys, ona bakmayı, hizmet etmeyi, yanında olmayı, Medine'ye gidip Peygamber'i görmekten daha önemli gördü. Bu bir iman eksikliği değildi — aksine, iki değeri bir arada taşıyabilmenin, hangisinin öncelikli olduğunu bilmenin bir işaretiydi.<br><br>Yıllarca bu sadakatle yaşadı; kimse onu tanımıyordu, kimse ondan bahsetmiyordu. Ama bir yerlerde, biri ondan zaten bahsetmişti.",
      "Hz. Peygamber, hayattayken bile sahabesine ondan bahsetti: 'Karanlı Üveys size gelecek, ona iyi davranın, ondan dua isteyin.' Bu sözler, henüz kimsenin tanımadığı bir insan için söylenmiş büyük bir işaretti.<br><br>Yıllar sonra, Hz. Ömer halifeliği döneminde bunu hatırladı. Yemen'den gelen bir grup insana sordu: 'Aranızda Karanlı Üveys var mı?'",
      "Üveys, kendini tanıtınca Hz. Ömer ondan dua istedi. Peygamber'in kendisi hakkında söylediklerini anlattı ona. Ama Üveys'in tepkisi beklenmedikti — insanların ilgisinden, şöhretinden rahatsız oldu.<br><br>Sessizce oradan ayrıldı. Bilinmeyi değil, sadakatini sürdürmeyi tercih etti. Bu, günümüzün 'görünür olma' kültürüne tam tersi bir duruştu.",

      "Hz. Peygamber onun için 'tabiinin en hayırlısı' buyurdu. Onu hiç görmemiş olması, değerini hiç azaltmadı — belki de tam tersi, onun sadakatini daha da anlamlı kıldı.<br><br>Bu hikaye bize önemli bir şey hatırlatıyor: bir insanın kıymeti, görünürlükle değil, sadakatle ölçülür. Üveys, hiç tanınmadan, hiç bilinmeden, sadece doğru olanı yaparak, İslam tarihinin en saygın isimlerinden biri haline geldi."
    ],
    sources: [
      "TDV İslam Ansiklopedisi, \"Üveys el-Karanî\" maddesi",
      "Ahmed b. Hanbel, el-Müsned",
      "İbn Sa'd, et-Tabakâtü'l-kübrâ"
    ]
  }
};

let currentStory = null;
let currentPage = 0;

function openReader(id) {
  currentStory = stories[id];
  currentPage = 0;
  document.getElementById('home').classList.remove('active');
  document.getElementById('reader').classList.add('active');
  renderBook();
}

function goHome() {
  document.getElementById('reader').classList.remove('active');
  document.getElementById('home').classList.add('active');
}

function totalPages() {
  return currentStory.pages.length + 1;
}

function renderBook(direction) {
  const book = document.getElementById('book');
  const total = totalPages();
  const existing = book.querySelectorAll('.page');

  const allPages = currentStory.pages.map((text, i) => ({
    isSource: false,
    html: `${i === 0 ? `<div class="eyebrow">${currentStory.title}</div><h3>Bölüm ${i + 1}</h3>` : ''}<p>${text}</p><span class="page-num">${i + 1} / ${total}</span>`
  }));
  const srcList = currentStory.sources.map(s => `<li style="margin-bottom:8px;">${s}</li>`).join('');
  allPages.push({
    isSource: true,
    html: `<div class="eyebrow">${currentStory.title}</div><h3>Kaynakça</h3><ul>${srcList}</ul><span class="page-num">${total} / ${total}</span>`
  });

  if (existing.length === 0) {
    allPages.forEach((p, i) => {
      const pageEl = document.createElement('div');
      pageEl.className = 'page';
      pageEl.style.zIndex = total - i;
      pageEl.innerHTML = p.html;
      if (i < currentPage) pageEl.classList.add('flipped');
      book.appendChild(pageEl);
    });
  } else {
    existing.forEach((pageEl, i) => {
      pageEl.innerHTML = allPages[i].html;
      pageEl.classList.remove('turning-fwd', 'turning-back');
      if (direction === 'fwd' && i === currentPage - 1) {
        pageEl.classList.add('turning-fwd');
        pageEl.addEventListener('animationend', () => pageEl.classList.add('flipped'), { once: true });
      } else if (direction === 'back' && i === currentPage) {
        pageEl.classList.add('turning-back');
        pageEl.addEventListener('animationend', () => pageEl.classList.remove('flipped'), { once: true });
      } else {
        pageEl.classList.toggle('flipped', i < currentPage);
      }
    });
  }

  document.getElementById('pageIndicator').textContent = `${currentPage + 1} / ${total}`;
  document.getElementById('prevBtn').disabled = currentPage === 0;
  document.getElementById('nextBtn').disabled = currentPage === total - 1;
}

function nextPage() {
  if (currentPage < totalPages() - 1) {
    currentPage++;
    renderBook('fwd');
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    renderBook('back');
  }
}

let touchStartX = 0;
let touchStartY = 0;
const bookWrapEl = document.querySelector('.book-wrap');
bookWrapEl.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
bookWrapEl.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
    if (dx < 0) nextPage(); else prevPage();
  }
}, { passive: true });
</script>

</body>
