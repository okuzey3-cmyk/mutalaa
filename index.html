<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Satır Arası</title>
<meta name="description" content="Satır Arası — kişisel kütüphane">
<meta name="theme-color" content="#1b2233">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Satır Arası">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%;transition:background .25s,color .25s}
body[data-theme=beyaz]{--bg:#ffffff;--fg:#1d1d1f;--muted:#6e6e73;--card:#f2f2f4;--line:#e3e3e6;--acc:#b3261e;--bar:rgba(255,255,255,.96);--hl:#ffe066}
body[data-theme=sepya]{--bg:#f4ecd8;--fg:#3b2f1e;--muted:#8a7a5f;--card:#ebe1c8;--line:#dccfae;--acc:#9c2a1c;--bar:rgba(244,236,216,.97);--hl:#f3c969}
body[data-theme=gece]{--bg:#1b2233;--fg:#dfe3ec;--muted:#8d97ad;--card:#252d42;--line:#323b54;--acc:#e5645a;--bar:rgba(27,34,51,.97);--hl:#8a6d1c}
body[data-theme=siyah]{--bg:#000;--fg:#c9c9cc;--muted:#76767b;--card:#141416;--line:#232326;--acc:#e5645a;--bar:rgba(0,0,0,.97);--hl:#6e5612}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
[hidden]{display:none!important}
#lib,#rd{position:fixed;inset:0}
#lib{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 18px) 18px calc(var(--sab) + 96px)}
.brand{display:flex;align-items:baseline;gap:10px;margin:6px 2px 2px}
.brand h1{font:700 30px/1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.5px}
.brand h1 i{color:var(--acc);font-style:normal}
.brand small{color:var(--muted);font-size:13px;letter-spacing:.4px}
.strip{display:flex;gap:10px;margin:14px 0 6px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border-radius:14px;padding:10px 14px;min-width:92px}
.chip b{display:block;font-size:20px}
.chip span{font-size:12px;color:var(--muted)}
.cont{display:flex;gap:16px;background:var(--card);border-radius:18px;padding:14px;margin:14px 0 6px;align-items:center;width:100%;text-align:left}
.cont .cover{width:72px;flex:0 0 72px}
.cont h3{margin:0 0 3px;font:700 17px/1.25 Georgia,serif}
.cont p{margin:0;color:var(--muted);font-size:13px}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.cont .go{margin-top:10px;display:inline-block;background:var(--acc);color:#fff;border-radius:20px;padding:7px 16px;font-size:14px;font-weight:600}
.search{width:100%;margin:14px 0 8px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:16px;outline:0}
.tabs{display:flex;gap:6px;margin:6px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:8px 15px;border-radius:20px;background:var(--card);font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--fg);color:var(--bg);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:20px 14px}
.bk{display:block;align-self:start;text-align:left;position:relative}
.bk .meta{margin-top:7px;font-size:12px;color:var(--muted);line-height:1.3}
.bk .meta b{display:block;color:var(--fg);font-size:13px;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cover{position:relative;aspect-ratio:2/3;border-radius:4px 9px 9px 4px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.28),inset 4px 0 6px -2px rgba(0,0,0,.35);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:12% 11% 10% 15%}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.18) 0,rgba(255,255,255,0) 7%,rgba(0,0,0,.18) 8%,rgba(0,0,0,0) 12%)}
.cover .ct{font:700 13px/1.15 Georgia,serif;font:700 clamp(10px,11.2cqw,18px)/1.15 Georgia,serif;padding-right:6%;hyphens:auto;text-shadow:0 1px 3px rgba(0,0,0,.4);position:relative;word-break:break-word}
.cover .cs{font:italic 10px/1.25 Georgia,serif;font:italic clamp(8px,8cqw,11px)/1.25 Georgia,serif;opacity:.88;position:relative;margin-bottom:auto;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cover .ca{font-size:10px;font-size:clamp(8px,8cqw,11px);opacity:.85;letter-spacing:.6px;text-transform:uppercase;position:relative}
.cover .rib{position:absolute;top:-2px;right:14%;width:11%;height:24%;background:#c0392b;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.cover .orn{position:relative;height:1px;width:100%;margin:8px 0 8px;flex:0 0 1px;background:rgba(255,255,255,.4)}
.cw{container-type:inline-size}
.pct{position:absolute;right:6px;bottom:48px;background:rgba(0,0,0,.65);color:#fff;border-radius:10px;font-size:11px;padding:2px 7px}
.fab{position:fixed;right:18px;bottom:calc(var(--sab) + 20px);width:54px;height:54px;border-radius:27px;background:var(--acc);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:5;display:flex;align-items:center;justify-content:center}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
/* okuyucu */
#rd{background:var(--bg);display:flex;flex-direction:column}
#vp{position:absolute;left:0;right:0;top:calc(var(--sat) + 22px);bottom:calc(var(--sab) + 30px);overflow:hidden;touch-action:pan-y}
#col{position:relative;column-fill:auto;transition:transform .22s ease;will-change:transform;hyphens:auto;-webkit-hyphens:auto;text-rendering:optimizeLegibility;user-select:text;-webkit-user-select:text}
#col.nt{transition:none}
#col h2{font-family:inherit;font-weight:700;font-size:1.35em;line-height:1.25;margin:.2em 0 1.1em;text-align:center;break-after:avoid}
#col h2:before{content:"✦";display:block;color:var(--acc);font-size:.6em;margin-bottom:.6em;opacity:.8}
#col p{margin:0;text-indent:1.4em;orphans:2;widows:2}
#col p.first,#col h2+p{text-indent:0}
#col p.sb{text-align:center;text-indent:0;margin:.9em 0;color:var(--muted);letter-spacing:.6em}
#col p.tts{background:rgba(120,160,255,.18);border-radius:4px}
#col p.sub{text-indent:0;text-align:left;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;font-size:.72em;letter-spacing:.9px;text-transform:uppercase;color:var(--acc);margin:1.5em 0 .6em;break-after:avoid;line-height:1.3}
#col p.li2{text-indent:-1em;padding-left:1em;text-align:left;font-size:.94em;margin:0 0 .5em}
#col mark{background:var(--hl);color:inherit;border-radius:2px;padding:0}
#col mark[data-c="g"]{background:#9ad9a0;color:#102}
#col mark[data-c="b"]{background:#9cc7f2;color:#102}
#col mark[data-c="p"]{background:#f2a6c3;color:#102}
#col mark.hn{border-bottom:2px solid var(--acc)}
.foot{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 6px);display:flex;justify-content:space-between;padding:0 22px;font-size:11.5px;color:var(--muted);pointer-events:none}
.head{position:absolute;left:0;right:0;top:calc(var(--sat) + 4px);text-align:center;font-size:11.5px;color:var(--muted);pointer-events:none;padding:0 60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rib2{position:absolute;top:calc(var(--sat) - 2px);right:22px;width:20px;height:34px;background:var(--acc);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);z-index:3;pointer-events:none}
.top,.bot{position:absolute;left:0;right:0;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:10;transition:transform .22s}
.top{top:0;padding:calc(var(--sat) + 6px) 8px 8px;display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line)}
.top .ttl{flex:1;min-width:0;text-align:center;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.ib{width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:12px;flex:0 0 42px}
.ib:active{background:var(--card)}
.ib.on{color:var(--acc)}
.bot{bottom:0;padding:12px 18px calc(var(--sab) + 12px);border-top:1px solid var(--line)}
.bot .rowi{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--acc);margin:6px 0}
body.nochrome .top{transform:translateY(-110%)}
body.nochrome .bot{transform:translateY(110%)}
body.nochrome .top,body.nochrome .bot{pointer-events:none}
#selbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 52px);background:var(--fg);color:var(--bg);border-radius:30px;padding:6px 8px;display:flex;gap:2px;align-items:center;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.4);max-width:96vw}
#selbar button{padding:7px 10px;font-size:14px;border-radius:20px;white-space:nowrap}
#selbar .dot{width:26px;height:26px;border-radius:13px;margin:0 3px;padding:0;border:2px solid rgba(255,255,255,.55)}
#selbar .sep{width:1px;height:20px;background:currentColor;opacity:.25;margin:0 4px}
/* sayfa altı paneller */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;background:var(--bg);color:var(--fg);border-radius:20px 20px 0 0;z-index:41;display:flex;flex-direction:column;padding-bottom:var(--sab);animation:up .22s ease;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;font-weight:700;font-size:17px}
.sheet .bd{overflow-y:auto;padding:0 18px 18px;-webkit-overflow-scrolling:touch}
.li{display:block;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.35}
.li small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.li.cur{color:var(--acc);font-weight:700}
.li q{display:block;font-family:Georgia,serif;font-style:italic;quotes:none;margin-bottom:3px;padding-left:10px;border-left:3px solid var(--hl)}
.set{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);gap:12px;font-size:15px}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:8px;font-size:14px}
.seg button.on{background:var(--fg);color:var(--bg);font-weight:600}
.th{display:flex;gap:10px}
.th button{width:44px;height:44px;border-radius:22px;border:2px solid var(--line);font-size:13px;font-weight:700}
.th button.on{border-color:var(--acc)}
textarea,.inp{width:100%;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;outline:0}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px}
.btn.g{background:var(--card);color:var(--fg)}
.row{display:flex;gap:10px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 90px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:14px;z-index:60;max-width:88vw;text-align:center;animation:up .2s}
.ttsbar{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 40px);background:var(--fg);color:var(--bg);border-radius:30px;padding:8px 10px;display:flex;align-items:center;gap:6px;z-index:12;box-shadow:0 6px 22px rgba(0,0,0,.4)}
.ttsbar span{flex:1;font-size:13px;padding-left:8px}
.ttsbar button{padding:8px 12px;border-radius:20px;font-size:15px}
.hint{font-size:12px;color:var(--muted);margin:10px 0}
</style>
</head>
<body data-theme="sepya">
<section id="lib">
  <div class="brand"><h1>Satır <i>Arası</i></h1><small>kişisel kütüphane</small></div>
  <div class="strip" id="stats"></div>
  <div id="contBox"></div>
  <input class="search" id="q" type="search" placeholder="Kitap veya yazar ara…" autocomplete="off">
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <button class="fab" id="add" aria-label="Kitap ekle">+</button>
  <input type="file" id="file" accept=".txt,.md,.markdown,.html,.htm,text/plain" hidden>
</section>

<section id="rd" hidden>
  <div class="head" id="head"></div>
  <div class="rib2" id="rib2" hidden></div>
  <div id="vp"><div id="col"></div></div>
  <div class="foot"><span id="fl"></span><span id="fr"></span></div>
  <div class="top">
    <button class="ib" id="bBack" aria-label="Geri">‹</button>
    <div class="ttl" id="rTitle"></div>
    <button class="ib" id="bBm" aria-label="Ayraç">🔖</button>
    <button class="ib" id="bTts" aria-label="Sesli oku">🔊</button>
    <button class="ib" id="bSearch" aria-label="Ara">🔍</button>
    <button class="ib" id="bMenu" aria-label="Menü">☰</button>
  </div>
  <div class="bot">
    <div class="rowi"><span id="bl"></span><span id="br"></span></div>
    <input type="range" id="slider" min="0" max="1000" value="0">
    <div class="rowi" style="margin:4px 0 0"><button id="bToc" style="color:var(--fg);font-size:14px">≡ İçindekiler</button><button id="bNotes" style="color:var(--fg);font-size:14px">✎ Notlarım</button><button id="bSet" style="color:var(--fg);font-size:15px;font-weight:700">Aa</button></div>
  </div>
  <div class="ttsbar" id="ttsbar" hidden><button id="tPrev">⏮</button><button id="tPlay">⏸</button><button id="tNext">⏭</button><span id="tInfo"></span><button id="tRate">1×</button><button id="tStop">✕</button></div>
</section>
<div id="selbar" hidden></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t,ms){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},ms||2200)}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

/* ---------- ayarlar ---------- */
var dark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
var S=Object.assign({theme:dark?'gece':'sepya',size:19,font:'serif',lh:1.6,margin:22,justify:true,rate:1},LS.get('sa_set',{}));
var FONTS={serif:'"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Serif",serif',sans:'-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif',kitap:'Georgia,"Times New Roman",serif'};
function applyTheme(){document.body.dataset.theme=S.theme;var m=document.querySelector('meta[name=theme-color]');if(m)m.content={beyaz:'#ffffff',sepya:'#f4ecd8',gece:'#1b2233',siyah:'#000000'}[S.theme]}
function saveS(){LS.set('sa_set',S)}
applyTheme();

/* ---------- IndexedDB (kendi eklediğin kitaplar) ---------- */
var idb=null;
function idbOpen(){return new Promise(function(res){try{var r=indexedDB.open('satirarasi',1);r.onupgradeneeded=function(){r.result.createObjectStore('books',{keyPath:'id'})};r.onsuccess=function(){idb=r.result;res(idb)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function idbAll(){return new Promise(function(res){if(!idb)return res([]);var o=[];var c=idb.transaction('books').objectStore('books').openCursor();c.onsuccess=function(){var x=c.result;if(x){o.push(x.value);x.continue()}else res(o)};c.onerror=function(){res(o)}})}
function idbPut(b){return new Promise(function(res){if(!idb)return res();var t=idb.transaction('books','readwrite');t.objectStore('books').put(b);t.oncomplete=res;t.onerror=res})}
function idbDel(id){return new Promise(function(res){if(!idb)return res();var t=idb.transaction('books','readwrite');t.objectStore('books').delete(id);t.oncomplete=res;t.onerror=res})}

/* ---------- kitaplık ---------- */
var PAL=[['#7b2d26','#3d1411'],['#1f3b57','#0d1b2a'],['#2d5a4a','#10281f'],['#5b3a6e','#241230'],['#8a5a1f','#3a230a'],['#37474f','#12191c'],['#8c2f4a','#35101c'],['#2a4d69','#0b1d2c']];
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
var LIST=[];var tab='tum';var qtext='';
function pos(id){return LS.get('sa_pos_'+id,null)}
function pctOf(id){var p=pos(id);return p?Math.round((p.pct||0)*100):0}
function state(id){var p=pos(id);if(!p)return 'sirada';return (p.pct||0)>=0.98?'bitti':'okuyorum'}
function coverHTML(b){var c=b.renk||PAL[hash(b.title)%PAL.length];var t=b.title;return '<div class="cw"><div class="cover" style="background:linear-gradient(150deg,'+c[0]+','+c[1]+')"><div class="rib"></div><div class="ct">'+esc(t)+'</div><div class="orn"></div><div class="cs">'+esc(b.alt||'')+'</div>'+(b.author?'<div class="ca">'+esc(b.author)+'</div>':'')+'</div></div>'}
function loadList(){
  return fetch('books/books.json',{cache:'no-cache'}).then(function(r){return r.json()}).catch(function(){var c=LS.get('sa_listcache',null);return c||{kitaplar:[]}}).then(function(j){
    LS.set('sa_listcache',j);
    return idbAll().then(function(loc){LIST=(j.kitaplar||[]).map(function(b){b.local=false;return b}).concat(loc.map(function(b){return {id:b.id,title:b.title,author:b.author,kelime:b.kelime,local:true,renk:b.renk}}));renderLib()});
  });
}
function statsHTML(){
  var st=LS.get('sa_stats',{});var t=today();var day=st[t]||0;
  var week=0,d=new Date();for(var i=0;i<7;i++){var k=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);week+=st[k]||0;d.setDate(d.getDate()-1)}
  var streak=0;d=new Date();if(!(st[t]>=60))d.setDate(d.getDate()-1);
  for(;;){var k2=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);if((st[k2]||0)>=60){streak++;d.setDate(d.getDate()-1)}else break}
  var done=LIST.filter(function(b){return state(b.id)==='bitti'}).length;
  function m(s){return Math.round(s/60)}
  return '<div class="chip"><b>'+m(day)+' dk</b><span>bugün</span></div><div class="chip"><b>'+m(week)+' dk</b><span>bu hafta</span></div><div class="chip"><b>'+streak+' gün</b><span>üst üste</span></div><div class="chip"><b>'+done+'</b><span>biten kitap</span></div>'
}
function renderLib(){
  $('#stats').innerHTML=statsHTML();
  var last=LS.get('sa_last',null);var lb=last&&LIST.filter(function(b){return b.id===last})[0];
  if(lb&&state(lb.id)==='okuyorum'){var p=pctOf(lb.id);$('#contBox').innerHTML='<button class="cont" data-open="'+esc(lb.id)+'"><div style="width:72px;flex:0 0 72px">'+coverHTML(lb)+'</div><div style="flex:1;min-width:0"><p>Kaldığın yerden devam et</p><h3>'+esc(lb.title)+'</h3><p>'+esc(lb.author||'')+'</p><div class="bar"><i style="width:'+p+'%"></i></div><span class="go">Devam · %'+p+'</span></div></button>'}else $('#contBox').innerHTML='';
  var names={tum:'Tümü',okuyorum:'Okuyorum',sirada:'Sırada',bitti:'Bitti'};
  $('#tabs').innerHTML=Object.keys(names).map(function(k){return '<button data-tab="'+k+'" class="'+(tab===k?'on':'')+'">'+names[k]+'</button>'}).join('');
  var q=qtext.toLowerCase();

function parseText(txt,title){
  txt=txt.replace(/\r/g,'').trim();var lines=txt.split('\n');var ch=[],cur=null;
  lines.forEach(function(l){var m=l.match(/^#{1,2}\s+(.+)/)||l.match(/^((?:BÖLÜM|Bölüm|KISIM|Kısım)\s+[\dIVXLC]+.*)$/);
    if(m){cur={title:m[1].trim(),text:''};ch.push(cur)}else{if(!cur){cur={title:'Başlangıç',text:''};ch.push(cur)}cur.text+=l+'\n'}});
  if(ch.length<=1){var all=txt.replace(/^#\s+.*\n/,'');var ps=all.split(/\n{2,}/),n=0,k=1;ch=[];var buf=[];ps.forEach(function(p){buf.push(p);n+=p.length;if(n>9000){ch.push({title:'Bölüm '+k++,text:buf.join('\n\n')});buf=[];n=0}});if(buf.length)ch.push({title:'Bölüm '+k,text:buf.join('\n\n')});if(ch.length===1)ch[0].title=title}

  all.sort(function(a,b){return a.o.ch-b.o.ch||a.o.p-b.o.p||(a.k==='h'?a.o.s:0)-(b.k==='h'?b.o.s:0)});
  var h=all.length?all.map(function(x){var o=x.o;return '<button class="li" data-g="'+o.ch+':'+o.p+'">'+(x.k==='h'?'<q style="border-color:'+({y:'#f3c969',g:'#9ad9a0',b:'#9cc7f2',p:'#f2a6c3'}[o.c])+'">'+esc(o.tx)+'</q>'+(o.n?'✎ '+esc(o.n):''):'🔖 '+esc(o.tx)+'…')+'<small>'+esc(B.chapters[o.ch].title)+'</small></button>'}).join('')+'<div class="row"><button class="btn" data-a="exp">Notları paylaş / kopyala</button></div>':'<div class="empty">Henüz vurgu, not ya da ayraç yok.<br>Bir cümleyi basılı tutup seç, renk veya Not’a dokun.</div>';
  sheet('Notlarım ('+all.length+')',h,function(e){
    var g=e.target.closest('[data-g]');if(g){var a=g.dataset.g.split(':');closeSheet();openChapter(+a[0],+a[1]);document.body.classList.add('nochrome');return}
    if(e.target.closest('[data-a=exp]')){var t=B.title+' — '+(B.author||'')+'\n\n';all.forEach(function(x){var o=x.o;t+=(x.k==='h'?'“'+o.tx+'”'+(o.n?'\n   Not: '+o.n:''):'Ayraç: '+o.tx+'…')+'\n   ('+B.chapters[o.ch].title+')\n\n'});
      if(navigator.share){navigator.share({title:B.title+' notlarım',text:t}).catch(function(){})}else{try{navigator.clipboard.writeText(t);toast('Kopyalandı')}catch(x){}}}
  });
};

/* ---------- kitapta ara ---------- */
$('#bSearch').onclick=function(){
  var sh=sheet('Kitapta ara','<input class="inp" id="sq" type="search" placeholder="Kelime veya cümle…" autocomplete="off"><div id="sr" style="margin-top:8px"></div>');
  var inp=$('#sq',sh);setTimeout(function(){inp.focus()},120);var tm=null;
  inp.oninput=function(){clearTimeout(tm);tm=setTimeout(function(){
    var q=inp.value.trim().toLocaleLowerCase('tr');var out=[];
    if(q.length>=2){B.chapters.forEach(function(c,ci){c.paras.forEach(function(p,pi){var i=p.toLocaleLowerCase('tr').indexOf(q);if(i>=0&&out.length<80){var a=Math.max(0,i-40);out.push('<button class="li" data-g="'+ci+':'+pi+'">…'+esc(p.slice(a,i))+'<b style="color:var(--acc)">'+esc(p.slice(i,i+q.length))+'</b>'+esc(p.slice(i+q.length,i+q.length+70))+'…<small>'+esc(c.title)+'</small></button>')}})})}
    $('#sr',sh).innerHTML=out.length?out.join(''):(q.length>=2?'<div class="empty">Sonuç yok.</div>':'');
  },250)};
  sh.addEventListener('click',function(e){var g=e.target.closest('[data-g]');if(g){var a=g.dataset.g.split(':');closeSheet();openChapter(+a[0],+a[1]);document.body.classList.add('nochrome')}});
};

/* ---------- sesli okuma ---------- */
var tts={on:false,paused:false,ch:0,p:0,rate:1,id:0};
function ttsStart(ci,pi){
  if(!('speechSynthesis' in window)){toast('Bu cihaz sesli okumayı desteklemiyor');return}
  tts.on=true;tts.paused=false;tts.ch=ci;tts.p=pi;tts.id++;speechSynthesis.cancel();
  $('#ttsbar').hidden=false;$('#tPlay').textContent='⏸';$('#tRate').textContent=S.rate+'×';document.body.classList.add('nochrome');speakNow();
}
function ttsStop(){tts.on=false;tts.id++;try{speechSynthesis.cancel()}catch(e){}$('#ttsbar').hidden=true;var t=col.querySelector('.tts');if(t)t.classList.remove('tts');$('#bTts').classList.remove('on')}
function chunks(t){var out=[],s=t.match(/[^.!?…]+[.!?…]*\s*/g)||[t],buf='';s.forEach(function(x){if((buf+x).length>200&&buf){out.push(buf);buf=x}else buf+=x});if(buf)out.push(buf);return out}
function speakNow(){
  if(!tts.on||!B)return;var myid=tts.id;var c=B.chapters[tts.ch];
  if(tts.p>=c.paras.length){if(tts.ch+1<B.chapters.length){tts.ch++;tts.p=0;return speakNow()}else{ttsStop();toast('Kitap bitti');return}}
  var txt=c.paras[tts.p].replace(/^## /,'').replace(/^• /,'');if(isSb(txt)){tts.p++;return speakNow()}
  if(cur.ch!==tts.ch)openChapter(tts.ch,tts.p);
  var el=col.querySelector('p[data-i="'+tts.p+'"]');
  var old=col.querySelector('.tts');if(old)old.classList.remove('tts');
  if(el){el.classList.add('tts');var pg=paraPage(el);if(pg!==cur.page)setPage(pg)}
  $('#tInfo').textContent=c.title;$('#bTts').classList.add('on');
  var parts=chunks(txt),i=0;
  (function one(){
    if(!tts.on||tts.id!==myid)return;if(i>=parts.length){tts.p++;return speakNow()}
    var u=new SpeechSynthesisUtterance(parts[i++]);u.lang='tr-TR';u.rate=S.rate;
    var vs=speechSynthesis.getVoices().filter(function(v){return /^tr/i.test(v.lang)});
    if(vs.length){var best=vs.filter(function(v){return /premium|enhanced|natural|yelda|filiz/i.test(v.name)})[0];u.voice=best||vs[0]}
    u.onend=one;u.onerror=function(){if(tts.id===myid&&tts.on)setTimeout(one,50)};
    speechSynthesis.speak(u);
  })();
}
$('#bTts').onclick=function(){if(tts.on){ttsStop();return}ttsStart(cur.ch,anchorPara());};
$('#tStop').onclick=ttsStop;
$('#tPlay').onclick=function(){if(tts.paused){tts.paused=false;speechSynthesis.resume();this.textContent='⏸'}else{tts.paused=true;speechSynthesis.pause();this.textContent='▶'}};
function ttsJump(d){tts.p=Math.max(0,tts.p+d);tts.id++;tts.paused=false;speechSynthesis.cancel();$('#tPlay').textContent='⏸';speakNow()}
$('#tNext').onclick=function(){ttsJump(1)};$('#tPrev').onclick=function(){ttsJump(-1)};
$('#tRate').onclick=function(){var r=[0.8,1,1.25,1.5],i=r.indexOf(S.rate);S.rate=r[(i+1)%r.length];saveS();this.textContent=S.rate+'×';ttsJump(0)};

/* ---------- okuma süresi ---------- */
var clock=null,lastAct=Date.now();
['touchstart','click','keydown'].forEach(function(ev){document.addEventListener(ev,function(){lastAct=Date.now()},{passive:true})});
function startClock(){stopClock();clock=setInterval(function(){if(document.hidden||!B)return;if(Date.now()-lastAct>90000&&!tts.on)return;var st=LS.get('sa_stats',{}),t=today();st[t]=(st[t]||0)+10;LS.set('sa_stats',st)},10000)}
function stopClock(){if(clock){clearInterval(clock);clock=null}}
var wl=null;function wake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.hidden)saveNow();else if(B)wake()});
window.addEventListener('pagehide',saveNow);

/* ---------- başlangıç ---------- */
idbOpen().then(loadList);
if('serviceWorker' in navigator&&/^https:|localhost/.test(location.protocol+location.hostname)){navigator.serviceWorker.register('sw.js').catch(function(){})}
window.__SA={get B(){return B},get cur(){return cur},get pages(){return pages},next:next,prev:prev,openBook:openBook,S:S};
})();
